name: DevOps Build, Provision and Deploy

on:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'

      - name: Install Dependencies
        env:
           NODE_ENV: development
        run: npm install

      # - name: Lint Application
      #   run: npm run lint || true

      # - name: Run Unit Tests
      #   run: npm test

      - name: Build Application
        run: npm run build

      - name: Archive Build Artifact
        run: tar -czf react-build.tar.gz -C build .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: react-build.tar.gz

  cd-terraform:
    name: Provision Infrastructure
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.outputs.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key Pair
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub

      - name: Setup Terraform 1.10.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Terraform Init & Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Output Server IP
        id: outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          IP=$(terraform output -raw server_public_ip)
          echo "server_ip=$IP" >> $GITHUB_OUTPUT

  cd-ansible:
    name: Deploy Application
    needs: cd-terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Setup Private SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Execute Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          SERVER_IP="${{ needs.cd-terraform.outputs.server_ip }}"
          echo "[web_servers]" > ansible/inventory.ini
          echo "$SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa" >> ansible/inventory.ini
          
          # Wait for SSH availability
          until nc -z -v -w5 $SERVER_IP 22; do echo "Waiting for SSH..."; sleep 5; done
          
          cp react-build.tar.gz /tmp/react-build.tar.gz
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
